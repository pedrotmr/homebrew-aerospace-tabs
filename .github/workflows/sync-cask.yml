name: Sync Homebrew cask

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-homebrew-cask
  cancel-in-progress: false

jobs:
  sync:
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - name: Check out tap
        uses: actions/checkout@v4

      - name: Verify the latest stable release and update the cask
        run: scripts/sync-cask.sh

      - name: Audit the cask
        run: scripts/audit-cask.sh

      - name: Commit the cask update
        shell: bash
        run: |
          set -euo pipefail
          cask="Casks/pedrotmr-aerospace-tabs.rb"
          if git diff --quiet -- "$cask"; then
            echo "The cask is already current."
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$cask"
          version=$(sed -n 's/^  version "\([^"]*\)"$/\1/p' "$cask")
          git commit -m "chore: update AeroSpace Tabs cask to v$version"
          git push origin HEAD:main
